[project]
name = "litegen"
version = "0.1.0"
description = "A lightweight training framework for accelerating diffusion tasks"
readme = "README.md"
requires-python = ">=3.11,<3.13"
# Only what `litegen/` imports, as version ranges: consumers embed LiteGen into
# training stacks locked to their own PyTorch and accelerator builds, and the
# lower bounds are the oldest releases providing the APIs LiteGen uses. This
# repository's own environments pin exact versions through the hardware groups
# below and uv.lock.
dependencies = [
    "einops>=0.8",
    "numpy>=1.26,<3",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0.1,<7",
    "safetensors>=0.7,<1",
    "torch>=2.8,<3",
]

[project.optional-dependencies]
# CUDA extensions, built on a GPU node against the installed torch. Neither is
# part of the standard environment or its checks; the README lists the build
# prerequisites.
apex = ["apex"]
flash-attn = ["flash-attn==2.8.3"]

[dependency-groups]
# Hardware stacks: an environment takes exactly one, and `gpu` is the default.
# torch and torchvision are pinned together because their builds must match.
gpu = ["torch==2.13.0", "torchvision==0.28.0"]
# The previous PyTorch release on CUDA 12.8, for training stacks still on it.
gpu-cu128 = ["torch==2.10.0", "torchvision==0.25.0"]
# Ascend 910B on aarch64. CANN 9.0 comes from the machine, not from here; its
# operator compiler imports decorator and scipy from this environment.
npu = [
    "torch==2.10.0",
    "torch-npu==2.10.0.post6",
    "torchvision==0.25.0",
    "decorator",
    "scipy",
]
dev = [
    "ipython>=9.17.0",
    "omegaconf>=2.3",
    "pytest>=8,<9",
    "pytest-xdist>=3.6,<4",
    { include-group = "examples" },
    { include-group = "lint" },
]
# Required to run anything under `examples/` and the Latte integration tests,
# which launch those scripts in this project's own environment. Versions match
# the uv.lock of the Latte baseline in `examples/latte`, except torchvision,
# which follows the torch of the hardware group. decord ships x86_64 wheels only.
examples = [
    "accelerate==0.34.2",
    "av==13.1.0",
    "beautifulsoup4==4.15.0",
    "decord==0.6.0; platform_machine == 'x86_64'",
    "diffusers[torch]==0.24.0",
    "einops==0.8.2",
    "ftfy==6.3.1",
    "huggingface-hub==0.25.2",
    "imageio-ffmpeg==0.6.0",
    "numpy==1.26.4",
    "omegaconf==2.3.1",
    "pandas==3.0.5",
    "pillow==12.3.0",
    "scikit-image==0.26.0",
    "sentencepiece==0.2.2",
    "tensorboard==2.21.0",
    "timm==1.0.28",
    "torchvision>=0.23,<1",
    "transformers==4.45.2",
]
lint = ["ruff>=0.16,<0.17"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["litegen*"]

[tool.uv]
package = true
default-groups = ["dev", "gpu"]
conflicts = [
    [{ group = "gpu" }, { group = "gpu-cu128" }, { group = "npu" }],
    [{ extra = "apex" }, { group = "npu" }],
    [{ extra = "flash-attn" }, { group = "npu" }],
]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", group = "gpu" },
    { index = "pytorch-cu128", group = "gpu-cu128" },
]
torchvision = [
    { index = "pytorch-cu132", group = "gpu" },
    { index = "pytorch-cu128", group = "gpu-cu128" },
]
apex = { git = "https://github.com/NVIDIA/apex.git" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.extra-build-dependencies]
apex = [{ requirement = "torch", match-runtime = true }]

[[tool.uv.dependency-metadata]]
name = "apex"
version = "0.1"
requires-dist = ["packaging>20.6"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "results", "assets", "*.md", "examples/latte"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B006", "B007", "B008", "B904"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that exercise multiple project components together",
    "gpu(n=1): tests that require at least n visible CUDA devices; opt in with --run-gpu",
    "npu(n=1): tests that require at least n visible Ascend NPU devices; opt in with --run-npu",
    "latte: tests for the Latte example training pipeline",
]
